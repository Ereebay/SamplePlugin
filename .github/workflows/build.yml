name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      # The plugin references the host via ..\AssettoServer\... — so it must be
      # built from inside an AssettoServer checkout. Check the host out first,
      # then drop this repo inside it.
      - name: Checkout AssettoServer (host)
        uses: actions/checkout@v4
        with:
          repository: Ereebay/AssettoServer
          ref: 0.0.55-main    # custom variant: build against the Ereebay fork (adds the localization API)
          path: AssettoServer
          fetch-depth: 0        # MinVer derives the version from git tags — needs full history

      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: AssettoServer/sample-plugin
          fetch-depth: 0        # MinVer derives the version from git tags

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build
        run: dotnet build AssettoServer/sample-plugin/SamplePlugin.csproj -c Release

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: SamplePlugin
          path: |
            AssettoServer/sample-plugin/bin/Release/net9.0/SamplePlugin.dll
            AssettoServer/sample-plugin/bin/Release/net9.0/lang/
            AssettoServer/sample-plugin/bin/Release/net9.0/lua/
